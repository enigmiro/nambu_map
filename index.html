<style>
  :root{
    --navy:#12233f;
    --navy-2:#1c3560;
    --paper:#f6f4ee;
    --paper-2:#ffffff;
    --ink:#1c2430;
    --muted:#6b7280;
    --line:#e4e1d8;

    --c-kinder-pub:#2e7d63;   /* 유치원(공립) */
    --c-kinder-priv:#5aa88a;  /* 유치원(사립) */
    --c-elem:#2563a6;         /* 초등학교 */
    --c-middle:#a6672a;       /* 중학교 */
    --c-high:#8b3a52;         /* 고등학교 */
  }

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--paper);
    color:var(--ink);
  }

  .app{
    display:grid;
    grid-template-rows:auto 1fr;
    height:100vh;
  }

  header{
    background:var(--navy);
    color:#fff;
    padding:14px 22px;
    display:flex;
    align-items:baseline;
    gap:14px;
    border-bottom:3px solid var(--c-elem);
  }
  header .eyebrow{
    font-size:11px;
    letter-spacing:.14em;
    color:#9fb0c9;
    font-weight:600;
  }
  header h1{
    font-size:18px;
    margin:0;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  header .stat{
    margin-left:auto;
    font-size:12px;
    color:#c7d2e3;
  }
  header .stat b{color:#fff;}

  .layout{
    display:grid;
    grid-template-columns:340px 1fr;
    min-height:0;
  }

  aside{
    background:var(--paper-2);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    min-height:0;
  }

  .panel{
    padding:16px 18px;
    border-bottom:1px solid var(--line);
  }

  .search-box{
    display:flex;
    gap:6px;
  }
  .search-box input{
    flex:1;
    padding:9px 11px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:13px;
    background:var(--paper);
  }
  .search-box input:focus{outline:2px solid var(--c-elem);outline-offset:1px;}

  .filter-title{
    font-size:11px;
    letter-spacing:.08em;
    color:var(--muted);
    font-weight:700;
    margin-bottom:10px;
    text-transform:uppercase;
  }

  .filter-row{
    display:flex;
    align-items:center;
    gap:9px;
    padding:6px 0;
    font-size:13.5px;
    cursor:pointer;
    user-select:none;
  }
  .filter-row input{accent-color:var(--navy-2);width:15px;height:15px;cursor:pointer;}
