<style>

<script>
/* ============================================================
   1. 설정
============================================================= */
const NEIS_ATPT_CODE = "E10";           // 인천광역시교육청

// 인천광역시 전역의 학교를 대상으로 하며, 5개 교육지원청
// (남부·북부·동부·서부·강화)으로 분류해 집계합니다.
//
// ⚠️ 나이스 관할기관명(JU_ORG_NM) 필드는 초·중학교는 지역청 이름이 들어오지만
// 고등학교는 "인천광역시교육청"처럼 시교육청 명칭만 들어와 구분이 불가능합니다.
// 그래서 이 필드 대신, 인천광역시교육청 공식 조직도 기준의 "주소(구·군)"로
// 분류합니다. (2026.7. 서구→서해구·검단구, 중구·동구→제물포구·영종구 개편 반영)
//
// 공식 관할 구역(인천광역시교육청 조직도 기준):
//   남부: 제물포구·영종구·미추홀구·옹진군 (개편 전 중구·동구 포함)
//   북부: 부평구·계양구
//   동부: 남동구·연수구
//   서부: 서구(서해구·검단구)
//   강화: 강화군
const OFFICE_META = {
  nambu:   { label: "남부" },
  bukbu:   { label: "북부" },
  dongbu:  { label: "동부" },
  seobu:   { label: "서부" },
  ganghwa: { label: "강화" },
};
const OFFICE_ORDER = ["nambu", "bukbu", "dongbu", "seobu", "ganghwa"];

// 주소에 포함된 구·군 이름으로 교육지원청을 판별.
// "남동구"가 "동구" 검사에 먼저 걸리는 등의 오탐을 막기 위해,
// 배열의 앞쪽에 더 구체적인(긴) 지명을 두어 먼저 매칭되게 합니다.
const DISTRICT_TO_OFFICE = [
  ["남동구", "dongbu"],
  ["연수구", "dongbu"],
  ["부평구", "bukbu"],
  ["계양구", "bukbu"],
  ["검단구", "seobu"],
  ["서해구", "seobu"],
  ["서구",   "seobu"],
  ["강화군", "ganghwa"],
  ["미추홀구", "nambu"],
  ["제물포구", "nambu"],
  ["영종구",   "nambu"],
  ["옹진군",   "nambu"],
  ["중구",     "nambu"],
  ["동구",     "nambu"],
];

// 학교 주소 문자열을 5개 교육지원청 키 중 하나로 분류
function officeKeyFromAddress(addr){
  const name = addr || "";
  for(const [kw, key] of DISTRICT_TO_OFFICE){
    if(name.includes(kw)) return key;
  }
  return null;
}

// ------------------------------------------------------------
// 나이스 교육정보 개방 포털 인증키 (무료 발급: https://open.neis.go.kr)
// ------------------------------------------------------------
const NEIS_KEY = "2652dd1c1da445c8aef448b305a1c88c";

const TYPE_META = {
  "elem":   { color: getCssVar("--c-elem"),   label: "초등학교" },
  "middle": { color: getCssVar("--c-middle"), label: "중학교" },
  "high":   { color: getCssVar("--c-high"),   label: "고등학교" },
};

function getCssVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

let map;
let geocoder;
let activeInfoWindow = null;
let allSchools = [];
let activeFilters = new Set(Object.keys(TYPE_META));
let searchTerm = "";
let neisLoadFailed = false;
let hoverOverlay = null;

/* ============================================================
   2. 카카오맵 로드
============================================================= */
function loadKakaoMaps(){
  if(KAKAO_APP_KEY === "YOUR_KAKAO_APP_KEY"){
    document.getElementById("statusBar").textContent =
      "⚠️ 카카오맵 JavaScript 키가 설정되지 않았습니다. index.html 상단의 KAKAO_APP_KEY 값을 교체해주세요.";
    return;
  }
  const script = document.createElement("script");
  script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_APP_KEY}&libraries=services&autoload=false`;
  script.onload = ()=> kakao.maps.load(initMap);
  script.onerror = ()=>{
    document.getElementById("statusBar").textContent =
      "⚠️ 카카오맵 스크립트 로드에 실패했습니다. JavaScript 키와 등록된 플랫폼 도메인을 확인하세요.";
  };
  document.head.appendChild(script);
}

const INIT_CENTER = { lat: 37.5200, lng: 126.6900 };
const INIT_LEVEL = 10;

function initMap(){
  map = new kakao.maps.Map(document.getElementById("map"), {
    center: new kakao.maps.LatLng(INIT_CENTER.lat, INIT_CENTER.lng),
    level: INIT_LEVEL,
  });
  map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
  geocoder = new kakao.maps.services.Geocoder();
  startDataLoad();
}

/* ============================================================
   3. 나이스 학교기본정보 API — 초/중/고
============================================================= */
async function fetchNeisSchools(){
  const keyParam = NEIS_KEY ? `&KEY=${encodeURIComponent(NEIS_KEY)}` : "";
  const url = `https://open.neis.go.kr/hub/schoolInfo?Type=json&pIndex=1&pSize=1000&ATPT_OFCDC_SC_CODE=${NEIS_ATPT_CODE}${keyParam}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error("NEIS API 응답 오류: " + res.status);
  const data = await res.json();
  const rows = (data.schoolInfo && data.schoolInfo[1] && data.schoolInfo[1].row) || [];

  return rows
    .filter(r => !isPlannedSchool(r))
    .map(r => ({
      name: r.SCHUL_NM,
      type: schoolKindToType(r.SCHUL_KND_SC_NM),
      found: r.FOND_SC_NM || "",
      address: (r.ORG_RDNMA || "") + " " + (r.ORG_RDNDA || ""),
      tel: r.ORG_TELNO || "",
      homepage: r.HMPG_ADRES || "",
      juOrg: r.JU_ORG_NM || "",
      office: officeKeyFromAddress(r.ORG_RDNMA),
    }))
    .filter(s => s.type);
}

function isPlannedSchool(r){
  const name = r.SCHUL_NM || "";
  if(name.includes("가칭") || name.includes("개교예정")) return true;
  const fond = (r.FOND_YMD || "").replace(/[^0-9]/g, "");
  if(fond.length === 8){
    const today = new Date();
    const todayStr = today.getFullYear()
      + String(today.getMonth() + 1).padStart(2, "0")
      + String(today.getDate()).padStart(2, "0");
    if(fond > todayStr) return true;
  }
  return false;
}

function schoolKindToType(kind){
  if(kind === "초등학교") return "elem";
  if(kind === "중학교") return "middle";
  if(kind === "고등학교") return "high";
  return null;
}

/* ============================================================
   4. 전체 로드 & 지오코딩
============================================================= */
async function startDataLoad(){
  const statusBar = document.getElementById("statusBar");
  try{
    statusBar.textContent = "나이스 API에서 초·중·고 정보를 불러오는 중…";
    const neisSchools = await fetchNeisSchools().catch(err=>{
      console.error(err);
      neisLoadFailed = true;
      return [];
    });

    allSchools = neisSchools.map(s => ({
      lat: null, lng: null, marker: null,
      ...s,
    }));

    const TYPE_ORDER = Object.keys(TYPE_META);
    allSchools.sort((a, b) => {
      const t = TYPE_ORDER.indexOf(a.type) - TYPE_ORDER.indexOf(b.type);
      if(t !== 0) return t;
      return a.name.localeCompare(b.name, "ko");
    });

    updateHeaderStat(`총 ${allSchools.length}개 기관 · 위치 변환 중…`);
    await geocodeAll(statusBar);

    if(neisLoadFailed){
      statusBar.textContent = "⚠️ 나이스(초·중·고) 호출 실패 — NEIS_KEY 확인";
    }else{
      statusBar.classList.add("hidden");
    }
    updateHeaderStat(`총 ${allSchools.length}개 기관 표시 중`);
    renderCounts();
    renderList();
  }catch(err){
    console.error(err);
    statusBar.textContent = "데이터를 불러오는 중 오류가 발생했습니다: " + err.message;
  }
}

function updateHeaderStat(text){
  document.getElementById("headerStat").innerHTML = text;
}

function geocodeAll(statusBar){
  return new Promise((resolve)=>{
    let i = 0;
    const cache = JSON.parse(localStorage.getItem("geocodeCache") || "{}");

    function next(){
      if(i >= allSchools.length){
        localStorage.setItem("geocodeCache", JSON.stringify(cache));
        resolve();
        return;
      }
      const school = allSchools[i];

      if(school.lat != null && school.lng != null){
        placeMarker(school);
        i++; next();
        return;
      }

      statusBar.textContent = `위치 변환 중… (${i+1}/${allSchools.length}) ${school.name}`;

      if(cache[school.address]){
        school.lat = cache[school.address].lat;
        school.lng = cache[school.address].lng;
        placeMarker(school);
        i++; next();
        return;
      }

      geocodeWithRetry(school.address, (lat, lng)=>{
        if(lat != null){
          school.lat = lat;
          school.lng = lng;
          cache[school.address] = { lat, lng };
          placeMarker(school);
        }else{
          console.warn("지오코딩 실패:", school.name, school.address);
        }
        i++;
        setTimeout(next, 120);
      });
    }
    next();
  });
}

// 나이스 주소 끝에 "(동명,건물명)" 같은 괄호 부가정보가 붙어 있으면
// 카카오 지오코더가 인식하지 못해 ZERO_RESULT가 나는 경우가 많습니다.
function stripAddressExtras(addr){
  return (addr || "").replace(/\([^)]*\)\s*$/, "").trim();
}

// ① 원본 주소 → ② 괄호 제거 주소 → ③ 도로명(첫 2~3단어)만 순서로 재시도
function geocodeWithRetry(address, callback){
  const stripped = stripAddressExtras(address);
  const roadOnly = stripped.split(" ").slice(0, 3).join(" ");

  const attempts = Array.from(new Set([address, stripped, roadOnly].filter(Boolean)));
  let idx = 0;

  function tryNext(){
    if(idx >= attempts.length){ callback(null, null); return; }
    const addr = attempts[idx++];
    geocoder.addressSearch(addr, (result, status)=>{
      if(status === kakao.maps.services.Status.OK && result[0]){
        callback(parseFloat(result[0].y), parseFloat(result[0].x));
      }else{
        tryNext();
      }
    });
  }
  tryNext();
}

/* ============================================================
   5. 마커 / 리스트 / 필터
============================================================= */
function makeMarkerImage(color){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18">
    <circle cx="9" cy="9" r="7" fill="${color}" stroke="#ffffff" stroke-width="2"/>
  </svg>`;
  const src = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
  return new kakao.maps.MarkerImage(src, new kakao.maps.Size(18,18), {
    offset: new kakao.maps.Point(9,9)
  });
}

function placeMarker(school){
  if(school.lat == null) return;
  const meta = TYPE_META[school.type];
  const marker = new kakao.maps.Marker({
    position: new kakao.maps.LatLng(school.lat, school.lng),
    map,
    title: school.name,
    image: makeMarkerImage(meta.color),
  });

  const homeLink = school.homepage
    ? `<a href="${school.homepage.startsWith('http') ? school.homepage : 'http://' + school.homepage}" target="_blank">홈페이지</a>`
    : "";
  const telHomeLine = (school.tel || homeLink)
    ? `<div style="font-size:12px;color:#555;white-space:nowrap;margin-top:2px;">${school.tel || ""}${(school.tel && homeLink) ? "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;" : ""}${homeLink}</div>`
    : "";
  const content = `
    <div style="font-family:inherit;padding:10px 14px;">
      <div style="font-weight:700;font-size:14px;margin-bottom:4px;white-space:nowrap;">${school.name}</div>
      <div style="font-size:12px;color:#555;margin-bottom:2px;white-space:nowrap;">${meta.label}${school.found ? " · " + school.found : ""}</div>
      <div style="font-size:12px;color:#555;margin-bottom:2px;white-space:nowrap;">${school.address}</div>
      ${telHomeLine}
    </div>`;

  kakao.maps.event.addListener(marker, "click", ()=> openInfo(marker, content));

  const supportsHover = window.matchMedia && window.matchMedia("(hover: hover)").matches;
  if(supportsHover){
    kakao.maps.event.addListener(marker, "mouseover", ()=> showHover(school));
    kakao.maps.event.addListener(marker, "mouseout",  ()=> hideHover());
  }

  school.marker = marker;
  school.infoContent = content;
  applyVisibility(school);
}

function showHover(school){
  const meta = TYPE_META[school.type];
  const html = `
    <div style="
      margin-left:16px;
      background:#ffffff;
      border:1px solid #cfd6dd;
      border-left:4px solid ${meta.color};
      border-radius:8px;
      box-shadow:0 2px 8px rgba(0,0,0,.18);
      padding:8px 12px;
      font-family:inherit;
      font-size:12px;
      line-height:1.55;
      white-space:nowrap;
      pointer-events:none;
    ">
      <div style="font-weight:700;font-size:13px;">${school.name}</div>
      <div style="color:#555;">${meta.label}${school.found ? " · " + school.found : ""}</div>
      <div style="color:#777;">${school.address}</div>
    </div>`;
  if(!hoverOverlay){
    hoverOverlay = new kakao.maps.CustomOverlay({
      zIndex: 20,
      xAnchor: 0,
      yAnchor: 0.5,
      clickable: false,
    });
  }
  hoverOverlay.setContent(html);
  hoverOverlay.setPosition(new kakao.maps.LatLng(school.lat, school.lng));
  hoverOverlay.setMap(map);
}

function hideHover(){
  if(hoverOverlay) hoverOverlay.setMap(null);
}

function openInfo(marker, content){
  if(!activeInfoWindow){
    activeInfoWindow = new kakao.maps.InfoWindow({ removable: true });
  }
  activeInfoWindow.setContent(content);
  activeInfoWindow.open(map, marker);
}

function applyVisibility(school){
  if(!school.marker) return;
  const matchesFilter = activeFilters.has(school.type);
  const matchesSearch = !searchTerm || school.name.includes(searchTerm);
  school.marker.setMap((matchesFilter && matchesSearch) ? map : null);
}

function renderCounts(){
  Object.keys(TYPE_META).forEach(type=>{
    const list = allSchools.filter(s =>
      s.type === type && (!searchTerm || s.name.includes(searchTerm))
    );
    const n = list.length;
    const b = list.filter(s => (s.name || "").includes("분교")).length;
    const el = document.getElementById("cnt-" + type);
    if(el) el.textContent = `${n} (분교 ${b}포함)`;

    const brkEl = document.getElementById("brk-" + type);
    if(brkEl){
      const matched = list.filter(s => s.office !== null);
      if(list.length > 0 && matched.length === 0){
        brkEl.innerHTML = `<span class="office-chip">⚠ 관할청 판별 불가(주소 확인 필요)</span>`;
        console.warn(
          `[${TYPE_META[type].label}] 주소 기반 관할청 매칭 실패 — 원본 주소 예시:`,
          Array.from(new Set(list.slice(0, 10).map(s => s.address)))
        );
      }else{
        brkEl.innerHTML = OFFICE_ORDER.map(key => {
          const officeList = list.filter(s => s.office === key);
          const cnt = officeList.length;
          const branch = officeList.filter(s => (s.name || "").includes("분교")).length;
          return `<span class="office-chip">${OFFICE_META[key].label} <b>${cnt}</b>(${branch})</span>`;
        }).join("");
      }
    }
  });
}

function renderList(){
  const wrap = document.getElementById("listWrap");
  wrap.innerHTML = "";
  let visible = allSchools.filter(s =>
    activeFilters.has(s.type) && (!searchTerm || s.name.includes(searchTerm))
  );

  if(visible.length === 0){
    wrap.innerHTML = `<div class="legend-note">표시할 학교가 없습니다.</div>`;
    return;
  }

  visible.forEach(school=>{
    const meta = TYPE_META[school.type];
    const item = document.createElement("div");
    item.className = "list-item";
    item.innerHTML = `
      <span class="tag" style="background:${meta.color}">${meta.label}</span>
      <div class="name" style="display:inline">${school.name}</div>
      <div class="meta">${school.address}</div>
    `;
    item.addEventListener("click", ()=>{
      if(school.lat == null) return;
      const pos = new kakao.maps.LatLng(school.lat, school.lng);
      map.setLevel(3);
      map.setCenter(pos);
      if(school.marker) openInfo(school.marker, school.infoContent);
    });
    wrap.appendChild(item);
  });
}

/* ============================================================
   6. 이벤트 바인딩
============================================================= */
document.querySelectorAll('input[type="checkbox"][data-type]').forEach(cb=>{
  cb.addEventListener("change", ()=>{
    const type = cb.dataset.type;
    if(cb.checked) activeFilters.add(type); else activeFilters.delete(type);
    allSchools.filter(s=>s.type===type).forEach(applyVisibility);
    renderList();
  });
});

document.getElementById("searchInput").addEventListener("input", (e)=>{
  searchTerm = e.target.value.trim();
  allSchools.forEach(applyVisibility);
  renderCounts();
  renderList();

  if(searchTerm === ""){
    resetToInitialView();
  }
});

function resetToInitialView(){
  if(!map) return;
  map.setLevel(INIT_LEVEL);
  map.setCenter(new kakao.maps.LatLng(INIT_CENTER.lat, INIT_CENTER.lng));
  if(activeInfoWindow) activeInfoWindow.close();
  hideHover();
}

loadKakaoMaps();
</script>
</body>
</html>
