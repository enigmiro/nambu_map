<style>
  :root{
    --navy:#12233f;
    --navy-2:#1c3560;
    --paper:#f6f4ee;
    --paper-2:#ffffff;
    --ink:#1c2430;
    --muted:#6b7280;

  .status-bar{

<div class="app">

<script>
/* ============================================================
   1. 설정
============================================================= */
const SIDO_LIST = [
  { code:"B10", name:"서울", lat:37.5665, lng:126.9780, level:9  },
  { code:"C10", name:"부산", lat:35.1796, lng:129.0756, level:9  },
  { code:"D10", name:"대구", lat:35.8714, lng:128.6014, level:9  },
  { code:"E10", name:"인천", lat:37.4563, lng:126.7052, level:10 },
  { code:"F10", name:"광주", lat:35.1595, lng:126.8526, level:9  },
  { code:"G10", name:"대전", lat:36.3504, lng:127.3845, level:9  },
  { code:"H10", name:"울산", lat:35.5384, lng:129.3114, level:9  },
  { code:"I10", name:"세종", lat:36.4801, lng:127.2891, level:9  },
  { code:"J10", name:"경기", lat:37.4138, lng:127.5183, level:11 },
  { code:"K10", name:"강원", lat:37.8228, lng:128.1555, level:12 },
  { code:"M10", name:"충북", lat:36.6357, lng:127.4917, level:11 },
  { code:"N10", name:"충남", lat:36.5184, lng:126.8000, level:11 },
  { code:"P10", name:"전북", lat:35.7175, lng:127.1530, level:11 },
  { code:"Q10", name:"전남", lat:34.8161, lng:126.4630, level:12 },
  { code:"R10", name:"경북", lat:36.4919, lng:128.8889, level:12 },
  { code:"S10", name:"경남", lat:35.4606, lng:128.2132, level:11 },
  { code:"T10", name:"제주", lat:33.4996, lng:126.5312, level:10 },
];
const DEFAULT_SIDO_CODE = "E10";

// ------------------------------------------------------------
// 나이스 교육정보 개방 포털 인증키 (무료 발급: https://open.neis.go.kr)
// ------------------------------------------------------------
const NEIS_KEY = "2652dd1c1da445c8aef448b305a1c88c";

const MAX_MARKERS = 400;

const TYPE_META = {
  "elem":   { color: getCssVar("--c-elem"),   label: "초등학교" },
  "middle": { color: getCssVar("--c-middle"), label: "중학교" },
  "high":   { color: getCssVar("--c-high"),   label: "고등학교" },
};

function getCssVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

let map;
let geocoder;
let activeInfoWindow = null;
let allSchools = [];
let activeFilters = new Set(Object.keys(TYPE_META));
let searchTerm = "";
let currentSido = null;
let currentLoadId = 0;
let neisLoadFailed = false;
let hoverOverlay = null;
let geoCache = {};

/* ============================================================
   2. 카카오맵 로드
============================================================= */
function loadKakaoMaps(){
  if(KAKAO_APP_KEY === "YOUR_KAKAO_APP_KEY"){
    document.getElementById("statusBar").textContent =
      "⚠️ 카카오맵 JavaScript 키가 설정되지 않았습니다. index.html 상단의 KAKAO_APP_KEY 값을 교체해주세요.";
    return;
  }
  const script = document.createElement("script");
  script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_APP_KEY}&libraries=services&autoload=false`;
  script.onload = ()=> kakao.maps.load(initMap);
  script.onerror = ()=>{
    document.getElementById("statusBar").textContent =
      "⚠️ 카카오맵 스크립트 로드에 실패했습니다. JavaScript 키와 등록된 플랫폼 도메인을 확인하세요.";
  };
  document.head.appendChild(script);
}

function initMap(){
  const def = SIDO_LIST.find(s => s.code === DEFAULT_SIDO_CODE);
  map = new kakao.maps.Map(document.getElementById("map"), {
    center: new kakao.maps.LatLng(def.lat, def.lng),
    level: def.level,
  });
  map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
  geocoder = new kakao.maps.services.Geocoder();
  loadGeoCache();
  populateSidoSelect();
  loadSido(DEFAULT_SIDO_CODE);
}

function populateSidoSelect(){
  const sel = document.getElementById("sidoSelect");
  SIDO_LIST.forEach(s=>{
    const opt = document.createElement("option");
    opt.value = s.code;
    opt.textContent = s.name;
    if(s.code === DEFAULT_SIDO_CODE) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.addEventListener("change", ()=> loadSido(sel.value));
}

/* ============================================================
   3. 나이스 학교기본정보 API — 선택된 시도 1곳만 로드
============================================================= */
async function fetchOneSido(sido){
  const keyParam = NEIS_KEY ? `&KEY=${encodeURIComponent(NEIS_KEY)}` : "";
  const pSize = 1000;
  let pIndex = 1;
  let all = [];
  while(true){
    const url = `https://open.neis.go.kr/hub/schoolInfo?Type=json&pIndex=${pIndex}&pSize=${pSize}&ATPT_OFCDC_SC_CODE=${sido.code}${keyParam}`;
    const res = await fetch(url);
    if(!res.ok) throw new Error(`${sido.name} NEIS 응답 오류: ${res.status}`);
    const data = await res.json();
    const rows = (data.schoolInfo && data.schoolInfo[1] && data.schoolInfo[1].row) || [];
    if(rows.length === 0) break;
    all = all.concat(rows);
    const totalCount = data.schoolInfo[0] && data.schoolInfo[0].head &&
      data.schoolInfo[0].head[0] && data.schoolInfo[0].head[0].list_total_count;
    if(!totalCount || all.length >= totalCount || rows.length < pSize) break;
    pIndex++;
  }
  return all;
}

async function loadSido(code){
  const sido = SIDO_LIST.find(s => s.code === code);
  if(!sido) return;

  const loadId = ++currentLoadId;
  currentSido = sido;

  allSchools.forEach(s=>{ if(s.marker) s.marker.setMap(null); });
  allSchools = [];
  searchTerm = "";
  const searchInput = document.getElementById("searchInput");
  if(searchInput) searchInput.value = "";
  hideHover();
  if(activeInfoWindow) activeInfoWindow.close();

  const statusBar = document.getElementById("statusBar");
  statusBar.classList.remove("hidden");
  statusBar.textContent = `${sido.name} 학교 정보를 불러오는 중…`;
  neisLoadFailed = false;
  renderCounts();
  renderList();

  let rows = [];
  let failed = false;
  try{
    rows = await fetchOneSido(sido);
  }catch(err){
    console.error(err);
    failed = true;
  }

  if(loadId !== currentLoadId) return;

  neisLoadFailed = failed;

  allSchools = rows
    .filter(r => !isPlannedSchool(r))
    .map(r => {
      const type = schoolKindToType(r.SCHUL_KND_SC_NM);
      if(!type) return null;
      return {
        name: r.SCHUL_NM,
        type,
        found: r.FOND_SC_NM || "",
        address: (r.ORG_RDNMA || "") + " " + (r.ORG_RDNDA || ""),
        tel: r.ORG_TELNO || "",
        homepage: r.HMPG_ADRES || "",
        juOrg: r.JU_ORG_NM || "",
        sido: sido.name,
        lat: null, lng: null, marker: null,
      };
    })
    .filter(Boolean);

  const TYPE_ORDER = Object.keys(TYPE_META);
  allSchools.sort((a, b) => {
    const t = TYPE_ORDER.indexOf(a.type) - TYPE_ORDER.indexOf(b.type);
    if(t !== 0) return t;
    return a.name.localeCompare(b.name, "ko");
  });

  updateHeaderStat(`${sido.name} · 총 ${allSchools.length.toLocaleString()}개교`);
  map.setLevel(sido.level);
  map.setCenter(new kakao.maps.LatLng(sido.lat, sido.lng));

  renderCounts();
  renderList();
  updateMapMarkers();

  if(neisLoadFailed){
    statusBar.textContent = `⚠️ ${sido.name} 데이터 호출에 실패했습니다. 새로고침하거나 다른 시도를 선택해보세요.`;
    statusBar.classList.remove("hidden");
  }
}

function isPlannedSchool(r){
  const name = r.SCHUL_NM || "";
  if(name.includes("가칭") || name.includes("개교예정")) return true;
  const fond = (r.FOND_YMD || "").replace(/[^0-9]/g, "");
  if(fond.length === 8){
    const today = new Date();
    const todayStr = today.getFullYear()
      + String(today.getMonth() + 1).padStart(2, "0")
      + String(today.getDate()).padStart(2, "0");
    if(fond > todayStr) return true;
  }
  return false;
}

function schoolKindToType(kind){
  if(kind === "초등학교") return "elem";
  if(kind === "중학교") return "middle";
  if(kind === "고등학교") return "high";
  return null;
}

function updateHeaderStat(text){
  document.getElementById("headerStat").innerHTML = text;
}

/* ============================================================
   4. 지역교육지원청 이름 추출
============================================================= */
const SIDO_PREFIX_REGEX = /^(서울특별시|부산광역시|대구광역시|인천광역시|광주광역시|대전광역시|울산광역시|세종특별자치시|경기도|강원특별자치도|강원도|충청북도|충청남도|전북특별자치도|전라북도|전라남도|경상북도|경상남도|제주특별자치도)/;

function officeLabelFor(rawJuOrg){
  if(!rawJuOrg) return "정보없음";
  let s = rawJuOrg.replace(SIDO_PREFIX_REGEX, "").replace(/(교육지원청|교육청)$/, "").trim();
  return s.length ? s : "본청 직속";
}

/* ============================================================
   5. 지오코딩 (주소 → 좌표), 캐시, 재시도
============================================================= */
function loadGeoCache(){
  try{ geoCache = JSON.parse(localStorage.getItem("geocodeCacheV2") || "{}"); }
  catch(e){ geoCache = {}; }
}
function saveGeoCache(){
  try{ localStorage.setItem("geocodeCacheV2", JSON.stringify(geoCache)); }
  catch(e){ }
}

function stripAddressExtras(addr){
  return (addr || "").replace(/\([^)]*\)\s*$/, "").trim();
}

function geocodeWithRetry(address, callback){
  const stripped = stripAddressExtras(address);
  const roadOnly = stripped.split(" ").slice(0, 3).join(" ");
  const attempts = Array.from(new Set([address, stripped, roadOnly].filter(Boolean)));
  let idx = 0;
  function tryNext(){
    if(idx >= attempts.length){ callback(null, null); return; }
    const addr = attempts[idx++];
    geocoder.addressSearch(addr, (result, status)=>{
      if(status === kakao.maps.services.Status.OK && result[0]){
        callback(parseFloat(result[0].y), parseFloat(result[0].x));
      }else{
        tryNext();
      }
    });
  }
  tryNext();
}

function geocodeSchool(school, callback){
  if(school.lat != null){ callback(true); return; }
  if(geoCache[school.address]){
    school.lat = geoCache[school.address].lat;
    school.lng = geoCache[school.address].lng;
    callback(true);
    return;
  }
  geocodeWithRetry(school.address, (lat, lng)=>{
    if(lat != null){
      school.lat = lat; school.lng = lng;
      geoCache[school.address] = { lat, lng };
      saveGeoCache();
      callback(true);
    }else{
      callback(false);
    }
  });
}

/* ============================================================
   6. 마커 / 지도 표시 (필터링된 상위 N개만 지오코딩)
============================================================= */
function makeMarkerImage(color){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18">
    <circle cx="9" cy="9" r="7" fill="${color}" stroke="#ffffff" stroke-width="2"/>
  </svg>`;
  const src = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
  return new kakao.maps.MarkerImage(src, new kakao.maps.Size(18,18), {
    offset: new kakao.maps.Point(9,9)
  });
}

function placeMarker(school){
  if(school.lat == null) return;
  const meta = TYPE_META[school.type];

  if(school.marker){
    school.marker.setMap(map);
    return;
  }

  const marker = new kakao.maps.Marker({
    position: new kakao.maps.LatLng(school.lat, school.lng),
    map,
    title: school.name,
    image: makeMarkerImage(meta.color),
  });

  const homeLink = school.homepage
    ? `<a href="${school.homepage.startsWith('http') ? school.homepage : 'http://' + school.homepage}" target="_blank">홈페이지</a>`
    : "";
  const telHomeLine = (school.tel || homeLink)
    ? `<div style="font-size:12px;color:#555;white-space:nowrap;margin-top:2px;">${school.tel || ""}${(school.tel && homeLink) ? "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;" : ""}${homeLink}</div>`
    : "";
  const content = `
    <div style="font-family:inherit;padding:10px 14px;">
      <div style="font-weight:700;font-size:14px;margin-bottom:4px;white-space:nowrap;">${school.name}</div>
      <div style="font-size:12px;color:#555;margin-bottom:2px;white-space:nowrap;">${officeLabelFor(school.juOrg)} · ${meta.label}${school.found ? " · " + school.found : ""}</div>
      <div style="font-size:12px;color:#555;margin-bottom:2px;white-space:nowrap;">${school.address}</div>
      ${telHomeLine}
    </div>`;

  kakao.maps.event.addListener(marker, "click", ()=> openInfo(marker, content));

  const supportsHover = window.matchMedia && window.matchMedia("(hover: hover)").matches;
  if(supportsHover){
    kakao.maps.event.addListener(marker, "mouseover", ()=> showHover(school));
    kakao.maps.event.addListener(marker, "mouseout",  ()=> hideHover());
  }

  school.marker = marker;
  school.infoContent = content;
}

function showHover(school){
  const meta = TYPE_META[school.type];
  const html = `
    <div style="
      margin-left:16px;
      background:#ffffff;
      border:1px solid #cfd6dd;
      border-left:4px solid ${meta.color};
      border-radius:8px;
      box-shadow:0 2px 8px rgba(0,0,0,.18);
      padding:8px 12px;
      font-family:inherit;
      font-size:12px;
      line-height:1.55;
      white-space:nowrap;
      pointer-events:none;
    ">
      <div style="font-weight:700;font-size:13px;">${school.name}</div>
      <div style="color:#555;">${officeLabelFor(school.juOrg)} · ${meta.label}${school.found ? " · " + school.found : ""}</div>
      <div style="color:#777;">${school.address}</div>
    </div>`;
  if(!hoverOverlay){
    hoverOverlay = new kakao.maps.CustomOverlay({
      zIndex: 20, xAnchor: 0, yAnchor: 0.5, clickable: false,
    });
  }
  hoverOverlay.setContent(html);
  hoverOverlay.setPosition(new kakao.maps.LatLng(school.lat, school.lng));
  hoverOverlay.setMap(map);
}

function hideHover(){
  if(hoverOverlay) hoverOverlay.setMap(null);
}

function openInfo(marker, content){
  if(!activeInfoWindow){
    activeInfoWindow = new kakao.maps.InfoWindow({ removable: true });
  }
  activeInfoWindow.setContent(content);
  activeInfoWindow.open(map, marker);
}

function matchesCurrentFilters(s){
  return activeFilters.has(s.type) && (!searchTerm || s.name.includes(searchTerm));
}

function updateMapMarkers(){
  if(!map) return;
  const matching = allSchools.filter(matchesCurrentFilters);
  const capped = matching.length > MAX_MARKERS;
  const toShow = matching.slice(0, MAX_MARKERS);
  const toShowSet = new Set(toShow);

  allSchools.forEach(s=>{
    if(s.marker && !toShowSet.has(s)) s.marker.setMap(null);
  });

  const ready = toShow.filter(s => s.lat != null);
  const pending = toShow.filter(s => s.lat == null);
  ready.forEach(placeMarker);

  updateStatus(capped, matching.length, pending.length);

  if(pending.length){
    const snapshot = allSchools;
    processGeocodeQueue(pending, snapshot, ()=> {
      if(allSchools === snapshot) updateStatus(capped, matching.length, 0);
    });
  }
}

function processGeocodeQueue(list, snapshot, onDone){
  let i = 0;
  function next(){
    if(allSchools !== snapshot) return;
    if(i >= list.length){ onDone(); return; }
    const s = list[i++];
    geocodeSchool(s, (ok)=>{
      if(allSchools !== snapshot) return;
      if(ok) placeMarker(s);
      setTimeout(next, 80);
    });
  }
  next();
}

function updateStatus(capped, totalMatching, remaining){
  const statusBar = document.getElementById("statusBar");
  const msgs = [];
  if(neisLoadFailed) msgs.push("⚠ 데이터 호출 실패");
  if(remaining > 0) msgs.push(`위치 변환 중… (${remaining}건 남음)`);
  if(capped) msgs.push(`검색 결과 ${totalMatching.toLocaleString()}건 중 상위 ${MAX_MARKERS}건만 지도에 표시 — 목록에서 선택 시 개별 확인 가능`);
  if(msgs.length){
    statusBar.textContent = msgs.join(" · ");
    statusBar.classList.remove("hidden");
  }else{
    statusBar.classList.add("hidden");
  }
}

/* ============================================================
   7. 좌측 통계 / 목록
============================================================= */
function renderCounts(){
  Object.keys(TYPE_META).forEach(type=>{
    const list = allSchools.filter(s =>
      s.type === type && (!searchTerm || s.name.includes(searchTerm))
    );
    const n = list.length;
    const b = list.filter(s => (s.name || "").includes("분교")).length;
    const el = document.getElementById("cnt-" + type);
    if(el) el.textContent = `${n.toLocaleString()} (분교 ${b}포함)`;

    const brkEl = document.getElementById("brk-" + type);
    if(brkEl){
      const groups = {};
      list.forEach(s=>{
        const label = officeLabelFor(s.juOrg);
        if(!groups[label]) groups[label] = { cnt: 0, branch: 0 };
        groups[label].cnt++;
        if((s.name || "").includes("분교")) groups[label].branch++;
      });
      const labels = Object.keys(groups).sort((a, b) => a.localeCompare(b, "ko"));
      brkEl.innerHTML = labels.map(label => {
        const g = groups[label];
        return `<span class="office-chip">${label} <b>${g.cnt}</b>(${g.branch})</span>`;
      }).join("") || `<span class="office-chip">데이터 없음</span>`;
    }
  });
}

function renderList(){
  const wrap = document.getElementById("listWrap");
  wrap.innerHTML = "";
  const visible = allSchools.filter(matchesCurrentFilters);

  if(visible.length === 0){
    wrap.innerHTML = `<div class="legend-note">표시할 학교가 없습니다.</div>`;
    return;
  }

  visible.forEach(school=>{
    const meta = TYPE_META[school.type];
    const item = document.createElement("div");
    item.className = "list-item";
    item.innerHTML = `
      <span class="tag" style="background:${meta.color}">${meta.label}</span>
      <div class="name" style="display:inline">${school.name} <span style="color:var(--muted);font-weight:400;">· ${officeLabelFor(school.juOrg)}</span></div>
      <div class="meta">${school.address}</div>
    `;
    item.addEventListener("click", ()=>{
      const clickSnapshot = allSchools;
      const focus = ()=>{
        if(allSchools !== clickSnapshot) return;
        const pos = new kakao.maps.LatLng(school.lat, school.lng);
        map.setLevel(3);
        map.setCenter(pos);
        placeMarker(school);
        if(school.marker) openInfo(school.marker, school.infoContent);
      };
      if(school.lat != null){
        focus();
      }else{
        geocodeSchool(school, (ok)=>{ if(ok) focus(); });
      }
    });
    wrap.appendChild(item);
  });
}

/* ============================================================
   8. 이벤트 바인딩
============================================================= */
document.querySelectorAll('input[type="checkbox"][data-type]').forEach(cb=>{
  cb.addEventListener("change", ()=>{
    const type = cb.dataset.type;
    if(cb.checked) activeFilters.add(type); else activeFilters.delete(type);
    renderCounts();
    renderList();
    updateMapMarkers();
  });
});

document.getElementById("searchInput").addEventListener("input", (e)=>{
  searchTerm = e.target.value.trim();
  renderCounts();
  renderList();
  updateMapMarkers();

  if(searchTerm === ""){
    resetToInitialView();
  }
});

function resetToInitialView(){
  if(!map || !currentSido) return;
  map.setLevel(currentSido.level);
  map.setCenter(new kakao.maps.LatLng(currentSido.lat, currentSido.lng));
  if(activeInfoWindow) activeInfoWindow.close();
  hideHover();
}

loadKakaoMaps();
</script>
